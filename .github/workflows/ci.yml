name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest stable versions
          - elixir: '1.18.4'
            otp: '27.3'
          # Older but still supported versions
          - elixir: '1.17.3'
            otp: '27.1'
          - elixir: '1.16.3'
            otp: '26.2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Poppler and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpoppler-cpp-dev \
            poppler-utils \
            pkg-config \
            build-essential

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Compile project
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run unit tests
        run: mix test --exclude integration

      - name: Create test fixture PDF
        run: |
          # Create a simple test PDF using ghostscript
          sudo apt-get install -y ghostscript
          echo "%PDF-1.4
          1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj
          2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj
          3 0 obj << /Type /Page /Parent 2 0 R /Resources 4 0 R /MediaBox [0 0 612 792] /Contents 5 0 R >> endobj
          4 0 obj << /Font << /F1 << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> >> >> endobj
          5 0 obj << /Length 44 >> stream
          BT /F1 12 Tf 100 700 Td (Test PDF) Tj ET
          endstream endobj
          xref
          0 6
          0000000000 65535 f
          0000000009 00000 n
          0000000058 00000 n
          0000000115 00000 n
          0000000229 00000 n
          0000000327 00000 n
          trailer << /Size 6 /Root 1 0 R >>
          startxref
          420
          %%EOF" > test/fixtures/sample.pdf

      - name: Run integration tests
        run: mix test --include integration

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Poppler and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpoppler-cpp-dev \
            pkg-config \
            build-essential

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-static-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-static-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors --force

      - name: Check code formatting
        run: mix format --check-formatted
